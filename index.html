<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nihongo Flashcards Pi</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.mine.pi/pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        html, body {
            touch-action: pan-x pan-y;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            background-color: #F8F6FF;
            font-family: sans-serif;
        }
        /* Side Menu & Overlay */
        #side-menu.active { left: 0 !important; }
        #menu-overlay.active { opacity: 1 !important; }

        /* Bottom Nav Pi Style */
        .pi-bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100% !important;
            height: 75px; background: #fff; display: flex;
            justify-content: space-around; align-items: center;
            border-top: 1px solid #eee; z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .pi-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: #D97706; font-size: 10px; cursor: pointer; }
        .pi-nav-item.active { color: #673AB7; }
        .pi-nav-item i { font-size: 1.4rem; margin-bottom: 2px; }
        .pi-nav-main { transform: translateY(-20px); }
        .pi-main-circle {
            width: 60px; height: 60px; background: linear-gradient(135deg, #673AB7, #4B0082);
            border-radius: 50%; border: 5px solid #fff; color: #fff;
            display: flex; justify-content: center; align-items: center; font-size: 1.5rem;
            box-shadow: 0 10px 25px rgba(103, 58, 183, 0.4);
        }
        .pi-badge {
            position: absolute; top: 15px; right: 20%; background: #FF3B30;
            color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 10px; border: 2px solid #fff;
        }
        
        /* Card 3D Flip System */
        #card-container { perspective: 1200px; width: 100%; height: 300px; margin-bottom: 2rem; position: relative; }
        #card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d; cursor: pointer;
        }
        #card-inner.is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute; inset: 0;
            backface-visibility: hidden !important;
            -webkit-backface-visibility: hidden !important;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .card-front { background-color: #ffffff; z-index: 2; transform: rotateY(0deg); }
        .card-back { background-color: #F5F3FF; transform: rotateY(180deg); translateZ(1px); z-index: 1; }

        /* Design Details */
        .punch-hole {
            position: absolute; top: 24px; left: 24px; width: 42px; height: 42px;
            border-radius: 50%; background-color: #F8F6FF; display: flex;
            justify-content: center; align-items: center;
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.12); border: 2px solid #ffffff; z-index: 50;
        }

        /* Nav Controls */
        .control-group {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; max-width: 420px; margin: 24px auto; padding: 0 16px; gap: 12px;
        }
        .btn-next, .btn-nav-secondary {
            width: 140px !important; height: 54px; border-radius: 9999px;
            font-weight: 700; display: flex; align-items: center; justify-content: center;
            gap: 8px; flex-shrink: 0; transition: all 0.2s; cursor: pointer;
            border: 2px solid #8A2BE2 !important;
        }
        .app-brand-center { flex: 1; display: flex; justify-content: center; align-items: center; }
        .app-brand-center img { max-height: 35px; width: auto; }
        .btn-next { background: #8A2BE2 !important; color: #fff !important; }
        .btn-nav-secondary { background: rgba(138, 43, 226, 0.1) !important; color: #8A2BE2 !important; }
        .btn-next:active, .btn-nav-secondary:active { transform: scale(0.94); }

        .audio-hint-btn {
            position: absolute; top: 1.25rem; right: 1.25rem; z-index: 100;
            width: 3.5rem; height: 3.5rem; display: flex; align-items: center;
            justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .audio-hint-btn i {
            width: 2.4rem; height: 2.4rem; background: rgba(103, 58, 183, 0.1);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #673AB7; border: 1px solid rgba(103, 58, 183, 0.2);
        }
    </style>
</head>

<body>
    <header class="fixed top-0 left-0 w-full h-14 bg-gradient-to-r from-[#673AB7] to-[#4B0082] flex items-center justify-between px-4 z-[1500] shadow-lg">
        <button id="menu-toggle" class="text-white text-xl p-2 active:scale-90 transition-transform">
            <i class="fas fa-bars"></i>
        </button>
        <h1 class="text-white font-bold text-lg tracking-wide">Nihongo Flashcard With Pi <span class="text-yellow-400">π</span></h1>
        <div class="w-8"></div> 
    </header>

    <div id="side-menu" class="fixed top-0 left-[-100%] w-[70%] max-w-[300px] h-full bg-[#1A0D3F] z-[2000] transition-all duration-300 shadow-2xl">
        <div class="p-8">
            <div class="flex justify-end mb-8">
                <button id="menu-close" class="text-white text-3xl">&times;</button>
            </div>
            <nav class="flex flex-col gap-6">
                <a href="#" class="text-white font-bold flex items-center gap-3"><i class="fas fa-chess-knight text-yellow-500"></i> Level N1</a>
                <a href="#" class="text-white font-bold flex items-center gap-3"><i class="fas fa-project-diagram text-yellow-500"></i> Level N2</a>
                <a href="#" class="text-white font-bold flex items-center gap-3"><i class="fas fa-cubes text-yellow-500"></i> Level N3</a>
                <a href="#" class="text-white font-bold flex items-center gap-3"><i class="fas fa-seedling text-yellow-500"></i> Level N4+N5</a>
            </nav>
        </div>
    </div>
    <div id="menu-overlay" class="fixed inset-0 bg-black/50 z-[1999] hidden opacity-0 transition-opacity"></div>

    <main class="pt-20 pb-28 px-4 max-w-md mx-auto min-h-screen flex flex-col">
        
        <div id="user-info" class="bg-white rounded-xl p-3 shadow-sm mb-6 hidden border border-purple-50">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <p class="text-xs font-medium text-gray-700">User: <span id="username" class="text-purple-600">...</span></p>
                </div>
                <span id="premium-badge" class="hidden bg-yellow-100 text-yellow-700 text-[10px] font-bold px-2 py-1 rounded-full border border-yellow-200">PREMIUM 🌟</span>
            </div>
        </div>

        <div class="mb-6">
            <div class="flex justify-between items-center mb-1">
                <span class="text-[10px] font-bold text-purple-500 uppercase tracking-widest">Tiến độ học tập</span>
                <span id="progress-text" class="text-[10px] font-bold text-purple-500">0/10</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2">
                <div id="progress-bar" class="bg-purple-600 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div id="card-container" class="w-full aspect-[4/3] perspective-1000 mb-8">
            <div id="card-inner" class="relative w-full h-full transform-style-3d transition-transform duration-500 cursor-pointer">
                <div class="card-front absolute inset-0 bg-white rounded-2xl flex flex-col justify-center items-center shadow-xl border-b-4 border-purple-200">
                    <div class="audio-hint-btn" id="audio-hint">
                        <i class="fas fa-volume-up"></i>
                    </div>
                    <div class="punch-hole"><span id="card-id-front" class="text-[10px] font-black text-slate-500">1</span></div>
                    <h2 id="word" class="text-6xl font-bold text-gray-800"> </h2>
                    <p class="absolute bottom-4 text-[10px] text-purple-400 italic">Chạm để lật</p>
                </div>
                <div class="card-back absolute inset-0 bg-purple-50 rounded-2xl flex flex-col justify-center items-center shadow-xl border-b-4 border-purple-400 p-6">
                    <div class="punch-hole"><span id="card-id-back" class="text-[10px] font-black text-slate-500">1</span></div>
                    <p id="reading" class="text-2xl text-purple-600 mb-2"> </p>
                    <p id="meaning" class="text-3xl text-gray-800 font-bold text-center"> </p>
                    <div class="flex items-center gap-3 my-6 w-full justify-center">
                        <div class="h-[1px] w-10 bg-gradient-to-r from-transparent to-purple-300"></div>
                        <i class="fas fa-star text-[8px] text-purple-400"></i>
                        <div class="h-[1px] w-10 bg-gradient-to-l from-transparent to-purple-300"></div>
                    </div>
                    <p id="example" class="text-sm text-gray-500 italic text-center leading-relaxed"> </p>
                </div>
            </div>
        </div>

        <div class="control-group flex justify-between items-center w-full px-4">
            <button id="prev-btn" class="btn-nav-secondary invisible">
                <i class="fas fa-chevron-left"></i> Quay lại
            </button>
            <div class="app-brand-center">
                <span class="text-purple-300 font-bold">日本語</span>
            </div>
            <div id="right-controls">
                <button id="next-btn" class="btn-next">
                    Tiếp theo <i class="fas fa-chevron-right"></i>
                </button>
                <button id="finish-btn" class="hidden bg-green-500 text-white px-4 py-2 rounded-xl font-bold shadow-lg animate-bounce flex items-center gap-2">
                    Hoàn Thành! <i class="fas fa-graduation-cap"></i>
                </button>
            </div>
        </div>

        <section id="premium-section" class="mt-4 bg-gradient-to-r from-yellow-50 to-orange-50 border border-yellow-200 rounded-2xl p-4 flex justify-between items-center shadow-sm">
            <div>
                <h3 class="font-bold text-yellow-800 text-sm">Gói Premium 🌟</h3>
                <p class="text-[10px] text-yellow-700 uppercase">Mở khóa 2000+ từ vựng</p>
            </div>
            <button onclick="unlockPremiumContent()" class="bg-yellow-500 text-white px-4 py-2 rounded-xl font-bold text-xs shadow-md active:scale-95 transition-transform">3.14 Pi</button>
        </section>

        <button id="btn-auth" class="w-full mt-6 bg-white border-2 border-purple-600 text-purple-600 font-bold py-3 rounded-2xl active:bg-purple-50 transition-colors">Kết nối ví Pi</button>
    </main>

    <nav class="pi-bottom-nav">
        <div class="pi-nav-item active"><i class="fa-solid fa-house"></i><span>ホーム</span></div>
        <div class="pi-nav-item"><i class="fa-solid fa-layer-group"></i><span>単語帳</span></div>
        <div class="pi-nav-main"><div class="pi-main-circle"><i class="fa-solid fa-plus"></i></div></div>
        <div class="pi-nav-item relative"><i class="fa-solid fa-graduation-cap"></i><span>JLPT過去問</span></div>
        <div class="pi-nav-item"><i class="fa-solid fa-user"></i><span>プロフィール</span></div>
    </nav>

    <script>
        // Khởi tạo Pi SDK bản cập nhật mới nhất
        const Pi = window.Pi;
        if (Pi) {
            Pi.init({ version: "2.0", sandbox: true });
        }

        // Logic Auth 
        const btnAuth = document.getElementById('btn-auth');
        if (btnAuth) {
            btnAuth.addEventListener('click', async () => {
                try {
                    const scopes = ['username', 'payments'];
                    const auth = await Pi.authenticate(scopes, (payment) => console.log("Incomplete:", payment));
                    document.getElementById('username').innerText = auth.user.username;
                    document.getElementById('user-info').classList.remove('hidden');
                    btnAuth.classList.add('hidden');
                } catch (err) {
                    console.error("Auth failed:", err);
                    alert("Hãy mở ứng dụng này trong Pi Browser!");
                }
            });
        }
    </script> 
    <script src="app.js"></script>
</body>
</html>
