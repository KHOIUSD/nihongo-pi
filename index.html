<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongo Pro Card</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script>Pi.init({ version: "2.0", sandbox: true });</script>
    <style>
        :root { --green: #58a65c; --red: #d9534f; --purple: #57317f; }
        body { font-family: sans-serif; margin: 0; background: #f5f5f5; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { background: #fff; padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #ddd; font-weight: bold; }
        
        .status-bar { display: flex; justify-content: center; align-items: center; gap: 15px; padding: 10px; background: #fff; font-size: 18px; font-weight: bold; }
        .num-red { color: var(--red); }
        .num-green { color: var(--green); }

        .card-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; position: relative; }
        .flashcard { width: 100%; max-width: 340px; height: 450px; background: #fff; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; padding: 30px; box-sizing: border-box; text-align: center; transition: 0.3s; cursor: pointer; border: 1px solid #eee; }
        
        .kanji { font-size: 65px; font-weight: bold; margin-top: 50px; }
        .example { margin-top: 30px; text-align: left; font-size: 18px; color: #444; }
        .highlight { color: var(--red); font-weight: bold; }

        .controls { display: flex; justify-content: space-around; align-items: center; padding: 20px; background: #fff; border-top: 1px solid #eee; }
        .btn { border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-red { background: var(--red); color: white; }
        .btn-green { background: var(--green); color: white; }
        .btn-nav { background: #eee; color: #333; }
        
        .audio-btn { background: var(--green); width: 50px; height: 50px; border-radius: 50%; border: none; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="header">❮ Khóa học N2 (50 từ vựng)</div>

    <div class="status-bar">
        <span class="num-red" id="stat-wrong">0</span>
        <span id="stat-progress">← 1/50 →</span>
        <span class="num-green" id="stat-right">0</span>
        <button onclick="shuffleCards()" style="margin-left:10px; border:none; background:none; color:var(--green); font-weight:bold;">XÁO TRỘN</button>
    </div>

    <div class="card-container">
        <div class="flashcard" id="main-card" onclick="flip()">
            <div id="front-side">
                <div class="kanji" id="display-word">漏れる</div>
                <div class="example" id="display-ex">木と木の間から光が<span class="highlight">漏れ</span>ている。</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-nav" onclick="prev()">⬅ Lùi</button>
        <button class="audio-btn" onclick="speak()">🔊</button>
        <button class="btn btn-nav" onclick="next()">Tiếp ➡</button>
    </div>

    <div class="controls" style="padding-top: 0;">
        <button class="btn btn-red" onclick="mark(false)">CHƯA THUỘC (Vuốt Trái)</button>
        <button class="btn btn-green" onclick="mark(true)">ĐÃ THUỘC (Vuốt Phải)</button>
    </div>

    <script>
        // Danh sách mẫu 50 từ (Tôi rút gọn 5 từ mẫu, bạn có thể copy thêm vào)
        let vocabulary = [
            { j: "漏れる", v: "Rò rỉ", e: "光が<span class='highlight'>漏れ</span>ている。", s: "もれる" },
            { j: "食べる", v: "Ăn", e: "ご飯를<span class='highlight'>食べ</span>る。", s: "たべる" },
            { j: "行く", v: "Đi", e: "学校へ<span class='highlight'>行</span>く。", s: "いく" },
            { j: "見る", v: "Xem", e: "テレビを<span class='highlight'>見</span>る。", s: "みる" },
            { j: "来る", v: "Đến", e: "友達が<span class='highlight'>来</span>る。", s: "くる" }
            // ... Thêm đủ 50 từ ở đây
        ];

        let currentIndex = 0;
        let learned = new Set();
        let notLearned = new Set();
        let isShowingMean = false;

        function updateUI() {
            const item = vocabulary[currentIndex];
            document.getElementById('display-word').innerText = isShowingMean ? item.v : item.j;
            document.getElementById('display-ex').innerHTML = isShowingMean ? "Giải nghĩa: " + item.v : "Ví dụ:<br>" + item.e;
            document.getElementById('stat-progress').innerText = `← ${currentIndex + 1}/${vocabulary.length} →`;
            document.getElementById('stat-right').innerText = learned.size;
            document.getElementById('stat-wrong').innerText = notLearned.size;
        }

        function flip() { isShowingMean = !isShowingMean; updateUI(); }

        function next() {
            if (currentIndex < vocabulary.length - 1) {
                currentIndex++;
                isShowingMean = false;
                updateUI();
            }
        }

        function prev() {
            if (currentIndex > 0) {
                currentIndex--;
                isShowingMean = false;
                updateUI();
            }
        }

        function mark(isRight) {
            if (isRight) {
                learned.add(currentIndex);
                notLearned.delete(currentIndex);
            } else {
                notLearned.add(currentIndex);
                learned.delete(currentIndex);
            }
            next();
        }

        function shuffleCards() {
            vocabulary.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            learned.clear();
            notLearned.clear();
            updateUI();
            alert("Đã xáo trộn danh sách!");
        }

        function speak() {
            const msg = new SpeechSynthesisUtterance(vocabulary[currentIndex].j);
            msg.lang = 'ja-JP';
            window.speechSynthesis.speak(msg);
        }

        updateUI();
    </script>
</body>
</html>
