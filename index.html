<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nihongo Flashcards</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.mine.pi/pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --pi-purple: #673AB7; --pi-gold: #D97706; }
        html, body { 
            height: 100%; margin: 0; background-color: #F8F6FF; 
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden; touch-action: manipulation;
        }
        #scroll-area {
            height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding-top: 60px; padding-bottom: 100px;
        }
        /* Side Menu */
        #side-menu { transition: transform 0.3s ease-in-out; transform: translateX(-100%); }
        #side-menu.active { transform: translateX(0); }
        .menu-overlay { display: none; background: rgba(0,0,0,0.5); z-index: 1999; }
        .menu-overlay.active { display: block; }

        /* Card 3D */
        .perspective-1000 { perspective: 1000px; position: relative; }
        .transform-style-3d { transform-style: preserve-3d; position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);cursor: pointer; }
        .is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 24px;
            backface-visibility: hidden !important; 
            -webkit-backface-visibility: hidden !important;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .card-front { 
            background: white; z-index: 2;
            transform: rotateY(0deg); 
            transform-style: preserve-3d;
        }

        .card-back { 
            background: #f5f3ff; z-index: 1; 
            transform: rotateY(180deg); 
            transform-style: preserve-3d;
        }
        
        #audio-hint {
            position: absolute; top: 1rem; right: 1rem; 
            z-index: 50; 
        }
        
        /* Bottom Nav */
        .pi-bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 80px;
            background: #fff; display: flex; justify-content: space-around;
            border-top: 1px solid #eee; z-index: 1000; padding-bottom: env(safe-area-inset-bottom);
        }
        .pi-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--pi-gold); font-size: 10px; }
        .pi-nav-item.active { color: var(--pi-purple); }
        .pi-nav-main { transform: translateY(-25px); }
        .pi-main-circle {
            width: 55px; height: 55px; background: linear-gradient(135deg, #673AB7, #4B0082);
            border-radius: 50%; border: 4px solid var(--pi-gold); color: #fff;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <header class="fixed top-0 left-0 w-full h-14 bg-white flex items-center justify-between px-4 z-[1500] border-b shadow-sm">
        <button id="menu-toggle" class="text-[#D97706] p-2"><i class="fas fa-bars text-xl"></i></button>
        <h1 class="text-[#4B0082] font-bold text-md">Nihongo Flashcard <span class="text-yellow-500">π</span></h1>
        <div id="user-status-dot" class="w-3 h-3 bg-gray-300 rounded-full"></div>
    </header>

    <div id="menu-overlay" class="menu-overlay fixed inset-0"></div>
    <div id="side-menu" class="fixed top-0 left-0 w-64 h-full bg-white z-[2000] shadow-2xl p-6">
        <div class="flex justify-between items-center mb-8">
            <span class="font-bold text-purple-800">Menu</span>
            <button id="menu-close" class="text-2xl text-gray-400">&times;</button>
        </div>
        <nav class="flex flex-col gap-4">
            <button class="flex items-center gap-3 p-3 rounded-lg hover:bg-purple-50 text-amber-700 font-medium"><i class="fas fa-crown text-sm"></i> N1 Premium</button>
            <button class="flex items-center gap-3 p-3 rounded-lg hover:bg-purple-50 text-amber-700 font-medium"><i class="fas fa-star text-sm"></i> N2 Intermediate</button>
            <button class="flex items-center gap-3 p-3 rounded-lg bg-purple-100 text-purple-700 font-bold"><i class="fas fa-leaf text-sm"></i> N4 + N5 Basic</button>
        </nav>
    </div>

    <div id="scroll-area">
        <main class="max-w-md mx-auto px-5">
            <div id="user-info" class="hidden mb-6 mt-4 p-3 bg-white rounded-2xl border border-purple-100 shadow-sm flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-purple-100 rounded-full flex items-center justify-center text-purple-600 font-bold text-xs" id="user-initial">U</div>
                    <span id="username" class="text-sm font-medium text-gray-700">Username</span>
                </div>
                <span id="premium-badge" class="hidden text-[9px] bg-yellow-400 text-white px-2 py-1 rounded-full font-bold">PREMIUM</span>
            </div>

            <div class="mb-8">
                <div class="flex justify-between text-[10px] font-bold text-purple-400 mb-2 uppercase tracking-tighter">
                    <span>Tiến độ học</span>
                    <span id="progress-text">0/10</span>
                </div>
                <div class="w-full h-1.5 bg-gray-200 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-purple-400 to-purple-600 transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <div id="card-container" class="w-full aspect-[4/3] perspective-1000 mb-8">
                <div id="card-inner" class="relative w-full h-full transform-style-3d transition-transform duration-500 cursor-pointer">
                    <div class="card-front absolute inset-0 bg-white rounded-3xl shadow-xl flex flex-col items-center justify-center border-b-4 border-purple-200">
                        <button id="audio-hint" class="absolute top-4 right-4 w-12 h-12 flex items-center justify-center text-purple-500 bg-purple-50 rounded-full z-[100] active: scale-75">
                            <i class="fas fa-volume-up"></i>
                        </button>
                        <div class="absolute top-5 left-5 w-10 h-10 rounded-full bg-slate-50 border-2 border-white shadow-inner flex items-center justify-center text-[10px] font-bold text-slate-400" id="card-id-front">1</div>
                        <h2 id="word" class="text-6xl font-bold text-slate-800"></h2>
                        <p class="absolute bottom-4 -4 text-[10px] text-purple-400 opacity-60 animate-bounce">Chạm để lật</p><i class="fas fa-sync-alt text-lg"></i>
                    </div>
                    <div class="card-back absolute inset-0 bg-purple-50 rounded-3xl shadow-xl flex flex-col items-center justify-center border-b-4 border-purple-400 p-8 transform rotateY(180deg)">
                        <div class="absolute top-5 left-5 w-10 h-10 rounded-full bg-white shadow-inner flex items-center justify-center text-[10px] font-bold text-purple-300" id="card-id-back">1</div>
                        <p id="reading" class="text-xl text-purple-600 font-medium mb-1"></p>
                        <h3 id="meaning" class="text-3xl font-bold text-slate-800 text-center mb-4"></h3>
                        <div class="w-12 h-0.5 bg-purple-200 mb-4"></div>
                        <p id="example" class="text-sm text-slate-500 italic text-center leading-relaxed"></p>
                </div>
                </div>
            </div>

            <div class="flex justify-between items-center mt-10 gap-4">
                <button id="prev-btn" class="flex-1 py-4 rounded-2xl border-2 border-purple-600 text-purple-600 font-bold active:scale-95 transition-transform invisible">Quay lại</button>
                <button id="next-btn" class="flex-[1.5] py-4 rounded-2xl bg-purple-600 text-white font-bold shadow-lg shadow-purple-200 active:scale-95 transition-transform">Tiếp theo</button>
                <button id="finish-btn" class="hidden flex-[1.5] py-4 rounded-2xl bg-green-500 text-white font-bold shadow-lg shadow-green-200 animate-pulse">Hoàn thành!</button>
            </div>

            <div id="premium-section" class="mt-8 p-4 bg-gradient-to-br from-amber-50 to-orange-100 rounded-2xl border border-amber-200 flex items-center justify-between">
                <div>
                    <h4 class="text-amber-800 font-bold text-sm">Nâng cấp Premium</h4>
                    <p class="text-[10px] text-amber-600">Mở khóa toàn bộ 2.000 từ vựng N1-N5</p>
                </div>
                <button onclick="unlockPremiumContent()" class="bg-amber-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md">3.14 Pi</button>
            </div>

            <button id="btn-auth" class="w-full mt-6 py-4 border-2 border-dashed border-purple-300 rounded-2xl text-purple-400 font-medium hover:bg-purple-50 transition-colors">Đăng nhập với Pi Network</button>
        </main>
    </div>

    <nav class="pi-bottom-nav">
        <div class="pi-nav-item active"><i class="fas fa-home text-lg mb-1"></i><span>Trang chủ</span></div>
        <div class="pi-nav-item"><i class="fas fa-book text-lg mb-1"></i><span>Từ vựng</span></div>
        <div class="pi-nav-main"><div class="pi-main-circle"><i class="fas fa-plus text-xl"></i></div></div>
        <div class="pi-nav-item"><i class="fas fa-graduation-cap text-lg mb-1"></i><span>Luyện đề</span></div>
        <div class="pi-nav-item"><i class="fas fa-user text-lg mb-1"></i><span>Tôi</span></div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
