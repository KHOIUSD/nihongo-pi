<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongo Flashcards Pi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.mine.pi/pi-sdk.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="max-w-md mx-auto min-h-screen flex flex-col p-4">
        <header class="text-center py-6">
            <h1 class="text-2xl font-bold text-purple-700">Nihongo Web3 🇯🇵</h1>
            <p class="text-gray-500 text-sm italic">Học tiếng Nhật trên hệ sinh thái Pi</p>
        </header>

        <div id="user-info" class="bg-white rounded-xl p-4 shadow-md mb-4 hidden">
            <div class="flex items-center justify-between"> <div class="flex items-center gap-2">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <p class="text-sm font-medium text-gray-700">User: <span id="username" class="text-purple-600">...</span></p>
                </div>
        
                <span id="premium-badge" class="hidden bg-yellow-100 text-yellow-700 text-[10px] font-bold px-2 py-1 rounded-full border border-yellow-200">
                    PREMIUM 🌟
                </span>
            </div>
        </div>

        <main class="flex-grow flex flex-col justify-center items-center">
            <div id="card" class="bg-white w-full aspect-[4/3] rounded-2xl shadow-xl flex flex-col justify-center items-center p-8 transition-all duration-300 active:scale-95 cursor-pointer border-b-4 border-purple-200">
                <h2 id="kanji" class="text-6xl font-bold mb-4 text-gray-800">日本語</h2>
                <p id="reading" class="text-xl text-gray-500 mb-2 invisible">にほんご</p>
                <p id="meaning" class="text-lg text-purple-600 font-medium invisible">Tiếng Nhật</p>
            </div>
            <p class="mt-4 text-xs text-gray-400">Chạm vào thẻ để xem đáp án</p>

            <section id="premium-section" class="mt-8 w-full bg-gradient-to-r from-yellow-50 to-orange-50 border border-yellow-200 rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="font-bold text-yellow-800 flex items-center gap-1">
                            Gói Premium 🌟
                        </h3>
                        <p class="text-[10px] text-yellow-700 uppercase tracking-wider font-semibold">Mở khóa 2000+ từ vựng</p>
                    </div>
                    <button onclick="unlockPremiumContent()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-5 py-2 rounded-xl font-bold text-sm transition-colors shadow-md">
                        3.14 Pi
                    </button>
                </div>
            </section>
        </main>

        <footer class="py-6 flex flex-col gap-3">
            <button id="btn-next" class="w-full bg-purple-600 text-white font-bold py-4 rounded-2xl hover:bg-purple-700 shadow-lg transition-all active:translate-y-1">
                Thẻ tiếp theo
            </button>
            <button id="btn-auth" class="w-full bg-white border-2 border-purple-600 text-purple-600 font-bold py-3 rounded-2xl hover:bg-purple-50 transition-colors">
                Kết nối ví Pi
            </button>
        </footer>
    </div>

    <script>
        // --- INITIALIZATION ---
        const Pi = window.Pi;
        Pi.init({ version: "2.0", sandbox: true });

        const vocabulary = [
            { kanji: "加工", reading: "かこう", meaning: "Gia công" },
            { kanji: "合格", reading: "ごうかく", meaning: "Đỗ / Vượt qua" },
            { kanji: "改善", reading: "かいぜん", meaning: "Cải thiện (Kaizen)" }
        ];
        let currentIndex = 0;

        // --- UI INTERACTION LOGIC ---
        const card = document.getElementById('card');
        const reading = document.getElementById('reading');
        const meaning = document.getElementById('meaning');

        // Toggle card flip
        card.addEventListener('click', () => {
            reading.classList.toggle('invisible');
            meaning.classList.toggle('invisible');
        });

        // Next card action
        document.getElementById('btn-next').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % vocabulary.length;
            document.getElementById('kanji').innerText = vocabulary[currentIndex].kanji;
            document.getElementById('reading').innerText = vocabulary[currentIndex].reading;
            document.getElementById('meaning').innerText = vocabulary[currentIndex].meaning;
            reading.classList.add('invisible');
            meaning.classList.add('invisible');
        });

        // --- PI WEB3 LOGIC ---

        // 1. Authentication
        document.getElementById('btn-auth').addEventListener('click', async () => {
            try {
                const scopes = ['username', 'payments'];
                const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
                
                document.getElementById('username').innerText = auth.user.username;
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('btn-auth').classList.add('hidden');
            } catch (err) {
                console.error("Auth failed:", err);
                alert("Hãy mở ứng dụng này trong Pi Browser!");
            }
        });

        // 2. Payment Function
        async function unlockPremiumContent() {
            try {
                const paymentData = {
                    amount: 3.14,
                    memo: "Unlock Premium Japanese Vocab",
                    metadata: { item_id: "premium_01" }
                };

                const callbacks = {
                    onReadyForServerApproval: (paymentId) => {
                        console.log("Ready for approval. ID:", paymentId);
                        // Send paymentId to your backend here
                    },
                    onReadyForServerCompletion: (paymentId, txid) => {
                        console.log("Ready for completion. TXID:", txid);
                        // Verify completion with your backend here
                    },
                    onCancel: (paymentId) => console.log("Cancelled"),
                    onError: (error) => console.error("Error:", error),
                };

                await Pi.createPayment(paymentData, callbacks);
            } catch (err) {
                console.error("Payment initiation failed:", err);
            }
        }

        function onIncompletePaymentFound(payment) {
            console.log("Found incomplete payment", payment);
        };
    </script>
    <script src="app.js"></script>
</body>
</html>
