<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongo Flashcards Pi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.mine.pi/pi-sdk.js"></script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .is-flipped { transform: rotateY(180deg); }
    </style>
</head>
    
<body class="bg-gray-100 font-sans">

    <div class="max-w-md mx-auto min-h-screen flex flex-col p-4">
        <header class="text-center py-6">
            <h1 class="text-2xl font-bold text-purple-700">Nihongo Flashcards 🇯🇵</h1>
            <p class="text-gray-500 text-sm italic">Học tiếng Nhật trên hệ sinh thái Web3 Pi Network</p>
        </header>

        <div id="user-info" class="bg-white rounded-xl p-4 shadow-md mb-4 hidden">
            <div class="flex items-center justify-between"> <div class="flex items-center gap-2">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <p class="text-sm font-medium text-gray-700">User: <span id="username" class="text-purple-600">...</span></p>
                </div>
        
                <span id="premium-badge" class="hidden bg-yellow-100 text-yellow-700 text-[10px] font-bold px-2 py-1 rounded-full border border-yellow-200">
                    PREMIUM 🌟
                </span>
            </div>
        </div>

        <div class="max-w-md mx-auto px-4 mb-2">
            <div class="flex justify-between items-center mb-1">
                <span class="text-[10px] font-bold text-purple-500 uppercase tracking-widest">Tiến độ học tập</span>
                <span id="progress-text" class="text-[10px] font-bold text-purple-500">0/0</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-1.5">
                <div id="progress-bar" class="bg-purple-600 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>
        
        <main class="flex-grow flex flex-col justify-center items-center">
            <div id="card-container" class="w-full aspect-[4/3] perspective-1000 cursor-pointer group">
                <div id="card-inner" class="relative w-full h-full transition-transform duration-500 transform-style-3d shadow-xl rounded-2xl">
        
                    <div class="absolute inset-0 w-full h-full backface-hidden bg-white rounded-2xl flex flex-col justify-center items-center p-8 border-b-4 border-purple-200 relative">
                        <h2 id="kanji" class="text-6xl font-bold text-gray-800">日本語</h2>
                        <div class="absolute bottom-4 right-4 flex items-center gap-1.5 animate-pulse">
                            <span class="text-[10px] font-medium text-purple-400 italic">Chạm để lật</span>
                            <div class="bg-gradient-to-br from-purple-500 to-indigo-600 p-1 rounded-lg shadow-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                   <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <div class="absolute inset-0 w-full h-full backface-hidden bg-purple-50 rounded-2xl flex flex-col justify-center items-center p- rotate-y-180 border-b-4 border-purple-400">
                        <p id="reading" class="text-xl text-purple-600 mb-2 font-medium tracking-wide"></p>
                        <p id="meaning" class="text-3xl text-gray-800 font-bold text-center"></p>
                        <div class="w-12 h-1 bg-gradient-to-r from-purple-100 via-purple-300 to-purple-100 my-4 rounded-full shadow - sm"></div> <p id="example" class="text-sm text-gray-500 italic text-center px-4 leading-relaxed"></p>
                    </div>

               </div>
            </div>
            <button id="btn-next" class="mt-6 w-full bg-purple-600 text-white font-bold py-4 rounded-2xl hover:bg-purple-700 shadow-lg transition-all active:translate-y-1">
                Tiếp theo
            </button>
            <section id="premium-section" class="mt-8 w-full bg-gradient-to-r from-yellow-50 to-orange-50 border border-yellow-200 rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="font-bold text-yellow-800 flex items-center gap-1">
                            Gói Premium 🌟
                        </h3>
                        <p class="text-[10px] text-yellow-700 uppercase tracking-wider font-semibold">Mở khóa 2000+ từ vựng</p>
                    </div>
                    <button onclick="unlockPremiumContent()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-5 py-2 rounded-xl font-bold text-sm transition-colors shadow-md">
                        3.14 Pi
                    </button>
                </div>
            </section>
        </main>

        <footer class="py-6 flex flex-col gap-3">
            <button id="btn-auth" class="w-full bg-white border-2 border-purple-600 text-purple-600 font-bold py-3 rounded-2xl hover:bg-purple-50 transition-colors">
                Kết nối ví Pi
            </button>
        </footer>
    </div>

    <script>
        // --- INITIALIZATION ---
        const Pi = window.Pi;
        Pi.init({ version: "2.0", sandbox: true });

        document.getElementById('btn-auth').addEventListener('click', async () => {
            try {
                const scopes = ['username', 'payments'];
                const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
                
                document.getElementById('username').innerText = auth.user.username;
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('btn-auth').classList.add('hidden');
            } catch (err) {
                console.error("Auth failed:", err);
                alert("Hãy mở ứng dụng này trong Pi Browser!");
            }
        });

        function onIncompletePaymentFound(payment) {
            console.log("Found incomplete payment", payment);
        };
    </script>
    <script src="app.js"></script>
</body>
</html>
