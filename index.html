<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nihongo Flashcards Pi</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.mine.pi/pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* KHÓA GIAO DIỆN CHUẨN QUỐC TẾ */
        html, body {
            height: 100%; margin: 0; padding: 0;
            overflow: hidden; /* Quan trọng: Khóa cuộn toàn trang */
            background-color: #F8F6FF;
            overscroll-behavior: none; /* Chặn hiệu ứng co giãn lò xo trên iOS/Android */
        }

        /* Vùng nội dung cuộn độc lập */
        #scroll-area {
            position: absolute;
            top: 56px; /* Chiều cao Header */
            bottom: 80px; /* Chiều cao Bottom Nav */
            left: 0; right: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px 16px;
        }

        /* Cấu trúc Card 3D - Đã tinh chỉnh để không mất mặt trước */
        .card-container { perspective: 1200px; width: 100%; aspect-ratio: 4/3; position: relative; }
        .card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .is-flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute; inset: 0;
            backface-visibility: hidden !important;
            -webkit-backface-visibility: hidden !important;
            border-radius: 24px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .card-front { background: white; z-index: 2; transform: rotateY(0deg); border-bottom: 4px solid #E2E8F0; }
        .card-back { background: #F5F3FF; z-index: 1; transform: rotateY(180deg); border-bottom: 4px solid #673AB7; }

        /* Nút loa chuyên nghiệp - Luôn nổi lên trên */
        #audio-hint {
            position: absolute; top: 1rem; right: 1rem; z-index: 50;
            width: 3rem; height: 3rem; background: #F3F0FF; color: #673AB7;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s;
        }
        #audio-hint:active { transform: scale(0.9); }

        /* Header & Nav Cố định */
        header { touch-action: none; }
        .pi-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; background: #fff; z-index: 1000; border-top: 1px solid #eee; touch-action: none; }
        .pi-nav-main { transform: translateY(-20px); }
        .pi-main-circle { width: 56px; height: 56px; background: linear-gradient(135deg, #673AB7, #4B0082); border-radius: 50%; border: 4px solid #D97706; color: #fff; display: flex; justify-content: center; align-items: center; }

        /* Side Menu */
        #side-menu { transition: 0.3s ease-in-out; left: -100%; }
        #side-menu.active { left: 0; }
        #menu-overlay.active { display: block; opacity: 1; }
    </style>
</head>
<body>
    <header class="fixed top-0 left-0 w-full h-14 bg-white flex items-center justify-between px-4 z-[1500] border-b shadow-sm">
        <button id="menu-toggle" class="text-[#D97706] p-2 text-xl"><i class="fas fa-bars"></i></button>
        <h1 class="text-[#4B0082] font-bold">Nihongo Flashcard Pi <span class="text-amber-500">π</span></h1>
        <div id="status-dot" class="w-2 h-2 rounded-full bg-gray-300"></div>
    </header>

    <div id="menu-overlay" class="fixed inset-0 bg-black/40 z-[1999] hidden opacity-0 transition-opacity"></div>
    <div id="side-menu" class="fixed top-0 w-64 h-full bg-white z-[2000] shadow-2xl p-6">
        <button id="menu-close" class="text-2xl text-gray-400 mb-6">&times;</button>
        <div class="space-y-4">
            <div class="p-4 bg-purple-50 rounded-xl text-purple-700 font-bold">N4 - N5 Basic</div>
            <div class="p-4 hover:bg-gray-50 rounded-xl text-gray-600">N3 - N2 Intermediate</div>
        </div>
    </div>

    <div id="scroll-area">
        <div class="mb-8 mt-2">
            <div class="flex justify-between text-[10px] font-bold text-purple-400 mb-2 uppercase">
                <span>Tiến độ học</span>
                <span id="progress-text">0/10</span>
            </div>
            <div class="w-full h-1.5 bg-gray-200 rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full bg-purple-600 transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div class="card-container">
            <button id="audio-hint" title="Nghe phát âm"><i class="fas fa-volume-up"></i></button>
            <div id="card-inner" class="cursor-pointer">
                <div class="card-front">
                    <div class="absolute top-5 left-5 w-9 h-9 rounded-full bg-gray-50 flex items-center justify-center text-[10px] font-bold text-gray-400 border" id="card-id-front">1</div>
                    <h2 id="word" class="text-6xl font-bold text-slate-800 tracking-tighter"></h2>
                </div>
                <div class="card-back p-8">
                    <div class="absolute top-5 left-5 w-9 h-9 rounded-full bg-white flex items-center justify-center text-[10px] font-bold text-purple-300 border" id="card-id-back">1</div>
                    <p id="reading" class="text-xl text-purple-600 font-medium mb-1"></p>
                    <h3 id="meaning" class="text-3xl font-bold text-slate-800 text-center"></h3>
                    <div class="w-10 h-0.5 bg-purple-200 my-4"></div>
                    <p id="example" class="text-sm text-slate-500 italic text-center leading-relaxed"></p>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center mt-10 gap-4">
            <button id="prev-btn" class="flex-1 py-4 rounded-2xl border-2 border-purple-600 text-purple-600 font-bold invisible">Trước</button>
            <button id="next-btn" class="flex-[2.2] py-4 rounded-2xl bg-purple-600 text-white font-bold shadow-lg shadow-purple-200 active:scale-95 transition-transform">Tiếp theo</button>
            <button id="finish-btn" class="hidden flex-[2.2] py-4 rounded-2xl bg-green-500 text-white font-bold shadow-lg shadow-green-200 animate-pulse">Hoàn thành!</button>
        </div>

        <div class="mt-8 p-4 bg-amber-50 rounded-2xl border border-amber-200 flex items-center justify-between">
            <div class="text-xs">
                <p class="font-bold text-amber-800">Mở khóa Premium</p>
                <p class="text-amber-600">Học toàn bộ 2.000 từ vựng</p>
            </div>
            <button onclick="unlockPremiumContent()" class="bg-amber-600 text-white px-4 py-2 rounded-xl font-bold text-[10px]">3.14 PI</button>
        </div>
    </div>

    <nav class="pi-bottom-nav">
        <div class="flex-1 flex flex-col items-center justify-center text-purple-600"><i class="fas fa-home text-lg"></i><span class="text-[9px] mt-1">Trang chủ</span></div>
        <div class="flex-1 flex flex-col items-center justify-center text-amber-600"><i class="fas fa-book text-lg"></i><span class="text-[9px] mt-1">Từ vựng</span></div>
        <div class="pi-nav-main flex flex-col items-center justify-center"><div class="pi-main-circle"><i class="fas fa-plus"></i></div></div>
        <div class="flex-1 flex flex-col items-center justify-center text-amber-600"><i class="fas fa-graduation-cap text-lg"></i><span class="text-[9px] mt-1">Luyện đề</span></div>
        <div class="flex-1 flex flex-col items-center justify-center text-amber-600"><i class="fas fa-user text-lg"></i><span class="text-[9px] mt-1">Tôi</span></div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
