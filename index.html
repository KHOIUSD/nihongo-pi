<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nihongo Flashcards Pi</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script>Pi.init({ version: "2.0", sandbox: true });</script>
    <style>
        :root { --pi-purple: #57317f; --green: #2ecc71; --red: #e74c3c; --bg: #f6f7fb; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Màn hình Trang chủ & Chọn bài */
        #home-screen, #lesson-screen { flex: 1; overflow-y: auto; padding: 20px; display: block; }
        .level-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; border-left: 5px solid var(--pi-purple); }
        .level-card h2 { margin: 0; color: var(--pi-purple); }
        .lesson-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .lesson-item { background: white; padding: 20px; text-align: center; border-radius: 12px; border: 1px solid #ddd; cursor: pointer; font-weight: bold; }

        /* Màn hình Flashcard */
        #card-screen { flex: 1; display: none; flex-direction: column; }
        .header { background: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .progress-bar { width: 100%; height: 5px; background: #e0e0e0; }
        #progress-fill { height: 100%; background: var(--pi-purple); width: 0%; transition: 0.3s; }

        .stage { flex: 1; display: flex; align-items: center; justify-content: center; perspective: 1200px; padding: 20px; position: relative; }
        .flashcard { width: 100%; max-width: 350px; height: 480px; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 25px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 30px; box-sizing: border-box; border: 1px solid #d1d5db; background: white; }
        .back { background: var(--pi-purple); color: white; transform: rotateY(180deg); text-align: center; }

        .kanji { font-size: 60px; font-weight: bold; }
        .example { margin-top: 20px; font-size: 18px; color: #444; border-top: 1px solid #eee; padding-top: 15px; width: 100%; }
        .back .example { color: #eee; border-top: 1px solid rgba(255,255,255,0.2); }
        .highlight { color: var(--red); font-weight: bold; }
        .speaker-icon { font-size: 24px; margin-top: 10px; color: var(--pi-purple); }
        .back .speaker-icon { color: white; }

        .footer { padding: 20px; background: white; display: flex; justify-content: space-between; border-top: 1px solid #eee; }
        .btn-circle { width: 60px; height: 60px; border-radius: 50%; border: none; color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
        .btn-wrong { background: var(--red); }
        .btn-right { background: var(--green); }
        .btn-nav { background: #eee; color: #333; width: 45px; height: 45px; border-radius: 10px; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <div id="home-screen">
        <h1 style="color: var(--pi-purple);">Nihongo Pi</h1>
        <div class="level-card" onclick="showLessons('N5')"><h2>N5</h2> <span>Sơ cấp 1 ❯</span></div>
        <div class="level-card" onclick="showLessons('N4')"><h2>N4</h2> <span>Sơ cấp 2 ❯</span></div>
        <div class="level-card" onclick="showLessons('N3')"><h2>N3</h2> <span>Trung cấp ❯</span></div>
        <div class="level-card" onclick="showLessons('N2')"><h2>N2</h2> <span>Thượng trung cấp ❯</span></div>
        <div class="level-card" onclick="showLessons('N1')"><h2>N1</h2> <span>Cao cấp ❯</span></div>
    </div>

    <div id="lesson-screen" style="display:none;">
        <button onclick="goHome()" style="border:none; background:none; color:var(--pi-purple); font-weight:bold; margin-bottom:20px;">❮ Quay lại</button>
        <h2 id="current-level-title">Bài học</h2>
        <div class="lesson-grid" id="lesson-list"></div>
    </div>

    <div id="card-screen">
        <div class="header">
            <span onclick="exitLesson()" style="cursor:pointer; font-weight:bold;">✕ Thoát</span>
            <div style="font-weight:bold;"><span id="num-wrong" style="color:var(--red);">0</span> | <span id="num-right" style="color:var(--green);">0</span></div>
        </div>
        <div class="progress-bar"><div id="progress-fill"></div></div>

        <div class="stage">
            <div class="flashcard" id="card" onclick="this.classList.toggle('flipped')">
                <div class="card-face front">
                    <div class="kanji" id="txt-jp">漏れる</div>
                    <div class="speaker-icon" onclick="speak('jp'); event.stopPropagation();">🔊</div>
                    <div class="example" id="txt-ex-jp">光が<span class="highlight">漏れ</span>ている。</div>
                    <div class="speaker-icon" onclick="speak('ex'); event.stopPropagation();" style="font-size: 18px;">🔊 (Câu ví dụ)</div>
                </div>
                <div class="card-face back">
                    <div style="font-size: 24px; opacity: 0.8;" id="txt-hira">もれる</div>
                    <div class="meaning" id="txt-vn">Rò rỉ, lộ ra</div>
                    <div class="example" id="txt-ex-vn">Ánh sáng đang rò rỉ (lọt) qua.</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <button class="btn-nav" onclick="move(-1)">❮</button>
            <button class="btn-circle btn-wrong" onclick="mark(false)">✘</button>
            <button class="btn-circle btn-right" onclick="mark(true)">✔</button>
            <button class="btn-nav" onclick="move(1)">❯</button>
        </div>
    </div>

    <script>
        // Cấu trúc dữ liệu mẫu (Cộng sự có thể thêm từ vựng vào đây)
        const database = {
            'N2': [
                { j: "漏れる", h: "もれる", v: "Rò rỉ", ej: "光が漏れている。", ev: "Ánh sáng đang rò rỉ." },
                { j: "焦る", h: "あせる", v: "Sốt ruột", ej: "時間がなくて焦る。", ev: "Vì không có thời gian nên sốt ruột." }
                // Thêm đủ từ vựng cho các cấp độ khác...
            ]
        };

        let currentVocab = [];
        let idx = 0;
        let learned = new Set();
        let skipped = new Set();

        function showLessons(lv) {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('lesson-screen').style.display = 'block';
            document.getElementById('current-level-title').innerText = "Cấp độ " + lv;
            
            let list = document.getElementById('lesson-list');
            list.innerHTML = "";
            for(let i=1; i<=5; i++) { // Giả sử mỗi cấp có 5 bài
                let div = document.createElement('div');
                div.className = 'lesson-item';
                div.innerText = "Bài học " + i;
                div.onclick = () => startLesson(lv, i);
                list.appendChild(div);
            }
        }

        function startLesson(lv, lessonIdx) {
            currentVocab = database['N2']; // Tạm thời dùng mẫu N2 cho tất cả bài
            idx = 0; learned.clear(); skipped.clear();
            document.getElementById('lesson-screen').style.display = 'none';
            document.getElementById('card-screen').style.display = 'flex';
            updateCard();
        }

        function updateCard() {
            const item = currentVocab[idx] || {j:"Hết bài", h:"", v:"", ej:"", ev:""};
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => {
                document.getElementById('txt-jp').innerText = item.j;
                document.getElementById('txt-hira').innerText = item.h;
                document.getElementById('txt-vn').innerText = item.v;
                document.getElementById('txt-ex-jp').innerHTML = item.ej;
                document.getElementById('txt-ex-vn').innerText = item.ev;
                
                let p = ((idx + 1) / currentVocab.length) * 100;
                document.getElementById('progress-fill').style.width = p + "%";
                document.getElementById('num-right').innerText = learned.size;
                document.getElementById('num-wrong').innerText = skipped.size;
            }, 150);
        }

        function move(step) {
            idx = (idx + step + currentVocab.length) % currentVocab.length;
            updateCard();
        }

        function mark(ok) {
            if(ok) { learned.add(idx); skipped.delete(idx); }
            else { skipped.add(idx); learned.delete(idx); }
            if(idx < currentVocab.length - 1) move(1);
        }

        function speak(type) {
            const item = currentVocab[idx];
            let text = (type === 'jp') ? item.j : item.ej;
            let msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ja-JP';
            window.speechSynthesis.speak(msg);
        }

        function goHome() {
            document.getElementById('lesson-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'block';
        }

        function exitLesson() {
            document.getElementById('card-screen').style.display = 'none';
            document.getElementById('lesson-screen').style.display = 'block';
        }

        Pi.authenticate(['username', 'payments']).catch(e => {});
    </script>
</body>
</html>
