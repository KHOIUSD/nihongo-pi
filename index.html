<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongo Flashcards Pi</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script>Pi.init({ version: "2.0", sandbox: true });</script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .flashcard-container { width: 300px; height: 400px; perspective: 1000px; }
        .flashcard { width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; position: relative; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); border: 3px solid #57317f; }
        .front { background: white; color: #333; }
        .front h1 { font-size: 80px; margin: 0; }
        .back { background: #57317f; color: white; transform: rotateY(180deg); padding: 20px; text-align: center; }
        .tap-hint { font-size: 12px; color: #888; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="user-info" style="text-align: center; margin: 20px; color: #57317f; font-weight: bold;">
        Đang kết nối với Pi...
    </div>

    <div class="flashcard-container">
    <div class="flashcard" onclick="this.classList.toggle('flipped')">
        <div class="front">
            <p style="color: #57317f; font-weight: bold;">N5</p>
            <h1>私</h1>
            <p class="tap-hint">Chạm để xem nghĩa</p>
        </div>
        <div class="back">
            <h2>わたし (Watashi)</h2>
            <p style="font-size: 24px;">Nghĩa: <strong>Tôi</strong></p>
            <hr style="width: 80%;">
            <p>Ví dụ: 私は学生です。<br>(Tôi là học sinh)</p>
        </div>
    </div>
</div>
<script>
        // Đoạn mã này giúp ứng dụng nhận diện người dùng Pi
        async function login() {
            try {
                // Yêu cầu người dùng cấp quyền truy cập tên
                const user = await Pi.authenticate(['username', 'payments']);
                document.getElementById('user-info').innerText = "Chào bạn: " + user.user.username;
            } catch (err) {
                document.getElementById('user-info').innerText = "Vui lòng mở App trong Pi Browser";
                console.error(err);
            }
        }
        
        // Gọi hàm đăng nhập khi trang web tải xong
        login();
</script>

</body>
</html>
