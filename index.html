<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nihongo Flashcards π</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.mine.pi/pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --pi-purple: #673AB7; --pi-gold: #D97706; }
        html, body { 
            height: 100%; margin: 0; background-color: #F8F6FF; 
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden; touch-action: manipulation;
        }
        #scroll-area {
            height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding-top: 70px; padding-bottom: 100px;
        }

        /* Side Menu */
        #side-menu { transition: transform 0.3s ease-in-out; transform: translateX(-100%); z-index: 2000; }
        #side-menu.active { transform: translateX(0); }
        .menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1999; }
        .menu-overlay.active { display: block; }

        /* Card 3D - FIX TRIỆT ĐỂ LỖI HIỂN THỊ */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { 
            transform-style: preserve-3d; 
            position: relative; 
            width: 100%; 
            height: 100%; 
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .is-flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 24px;
            backface-visibility: hidden !important; 
            -webkit-backface-visibility: hidden !important;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .card-front { 
            background: white; z-index: 2; 
            transform: rotateY(0deg); 
            border-bottom: 4px solid #EDE9FE;
        }

        .card-back { 
            background: #F5F3FF; z-index: 1; 
            transform: rotateY(180deg); 
            border-bottom: 4px solid #C4B5FD;
        }
        
        /* Đảm bảo nút loa luôn nhấn được */
        #audio-hint { z-index: 100; pointer-events: auto; }
        
        /* Bottom Nav */
        .pi-bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 80px;
            background: #fff; display: flex; justify-content: space-around;
            border-top: 1px solid #eee; z-index: 1000; padding-bottom: env(safe-area-inset-bottom);
        }
        .pi-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #A78BFA; font-size: 10px; }
        .pi-nav-item.active { color: var(--pi-purple); }
        .pi-nav-main { transform: translateY(-20px); }
        .pi-main-circle {
            width: 55px; height: 55px; background: linear-gradient(135deg, #673AB7, #4B0082);
            border-radius: 50%; border: 4px solid #FFF; color: #fff;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(75,0,130,0.3);
        }
    </style>
</head>
<body>
    <header class="fixed top-0 left-0 w-full h-14 bg-white flex items-center justify-between px-4 z-[1500] border-b shadow-sm">
        <button id="menu-toggle" class="text-amber-600 p-2"><i class="fas fa-bars text-xl"></i></button>
        <h1 class="text-[#4B0082] font-bold text-lg">Nihongo Flashcard <span class="text-yellow-500 text-xl">π</span></h1>
        <div id="user-status-dot" class="w-3 h-3 bg-gray-300 rounded-full border-2 border-white shadow-sm"></div>
    </header>

    <div id="menu-overlay" class="menu-overlay"></div>
    <div id="side-menu" class="fixed top-0 left-0 w-64 h-full bg-white shadow-2xl p-6">
        <div class="flex justify-between items-center mb-8">
            <span class="font-bold text-purple-800">Cấp độ học tập</span>
            <button id="menu-close" class="text-3xl text-gray-400">&times;</button>
        </div>
        <nav class="flex flex-col gap-3">
            <button class="flex items-center gap-3 p-4 rounded-xl hover:bg-purple-50 text-amber-700 font-medium border border-transparent hover:border-amber-100"><i class="fas fa-crown"></i> N1 Cao cấp</button>
            <button class="flex items-center gap-3 p-4 rounded-xl hover:bg-purple-50 text-amber-700 font-medium border border-transparent hover:border-amber-100"><i class="fas fa-star"></i> N3/N2 Trung cấp</button>
            <button class="flex items-center gap-3 p-4 rounded-xl bg-purple-100 text-purple-700 font-bold"><i class="fas fa-leaf"></i> N4 + N5 Sơ cấp</button>
        </nav>
    </div>
    
    <div id="scroll-area">
        <main class="max-w-md mx-auto px-5">
            <div id="user-info" class="hidden mb-6 p-4 bg-white rounded-2xl border border-purple-100 shadow-sm flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-full flex items-center justify-center text-white font-bold" id="user-initial">?</div>
                    <div>
                        <p id="username" class="text-sm font-bold text-gray-800">Username</p>
                        <p class="text-[10px] text-gray-400">Thành viên Pi Network</p>
                    </div>
                </div>
                <span id="premium-badge" class="hidden text-[10px] bg-gradient-to-r from-yellow-400 to-amber-600 text-white px-3 py-1 rounded-full font-bold shadow-sm">PREMIUM</span>
            </div>

            <div class="mb-6">
                <div class="flex justify-between text-[11px] font-bold text-purple-500 mb-2 uppercase tracking-widest">
                    <span>Tiến độ</span>
                    <span id="progress-text">0/0</span>
                </div>
                <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden shadow-inner">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-purple-500 to-indigo-500 transition-all duration-700" style="width: 0%"></div>
                </div>
            </div>

            <div id="card-container" class="w-full aspect-[4/3] perspective-1000 mb-10">
                <div id="card-inner" class="transform-style-3d">
                    <div class="card-front">
                        <button id="audio-hint" class="absolute top-4 right-4 w-12 h-12 flex items-center justify-center text-purple-600 bg-purple-50 rounded-full shadow-sm active:scale-90 transition-transform">
                            <i class="fas fa-volume-up text-xl"></i>
                        </button>
                        <div class="absolute top-5 left-5 w-10 h-10 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-xs font-bold text-slate-400" id="card-id-front">1</div>
                        <h2 id="word" class="text-6xl font-bold text-slate-800 tracking-tighter transition-opacity duration-300"></h2>
                        <div class="absolute bottom-6 flex flex-col items-center opacity-40 animate-pulse">
                            <i class="fas fa-hand-pointer text-sm mb-1"></i>
                            <span class="text-[9px] font-bold uppercase">Chạm để lật</span>
                        </div>
                    </div>
                    <div class="card-back p-8">
                        <div class="absolute top-5 left-5 w-10 h-10 rounded-full bg-white flex items-center justify-center text-xs font-bold text-purple-300" id="card-id-back">1</div>
                        <p id="reading" class="text-2xl text-purple-600 font-bold mb-2"></p>
                        <h3 id="meaning" class="text-3xl font-extrabold text-slate-800 text-center mb-4"></h3>
                        <div class="w-16 h-1 bg-purple-200 rounded-full mb-6"></div>
                        <p id="example" class="text-md text-slate-600 italic text-center leading-relaxed px-4"></p>
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-center gap-4">
                <button id="prev-btn" class="flex-1 py-4 rounded-2xl border-2 border-purple-200 text-purple-400 font-bold active:scale-95 transition-all invisible">Quay lại</button>
                <button id="next-btn" class="flex-[2] py-4 rounded-2xl bg-purple-600 text-white font-bold shadow-lg shadow-purple-200 active:scale-95 transition-all">Tiếp theo</button>
                <button id="finish-btn" class="hidden flex-[2] py-4 rounded-2xl bg-green-500 text-white font-bold shadow-lg shadow-green-200 animate-pulse">Hoàn thành! 🏆</button>
            </div>

            <div id="premium-section" class="mt-10 p-5 bg-gradient-to-br from-amber-50 to-orange-50 rounded-3xl border border-amber-200 flex items-center justify-between shadow-sm">
                <div>
                    <h4 class="text-amber-800 font-bold text-md flex items-center gap-2"><i class="fas fa-gem"></i> Gói Premium</h4>
                    <p class="text-[11px] text-amber-600 font-medium">Mở khóa 2.000+ từ vựng & Audio</p>
                </div>
                <button onclick="unlockPremiumContent()" class="bg-amber-600 text-white px-5 py-2.5 rounded-2xl text-sm font-bold shadow-lg active:scale-90 transition-transform">3.14 Pi</button>
            </div>
            <div>
                <button id="btn-auth" class="w-full mt-8 py-4 border-2 border-dashed border-purple-200 rounded-3xl text-purple-400 font-bold hover:bg-white hover:border-purple-400 transition-all mb-10">
                    <i class="fab fa-pushed mr-2"></i> Đăng nhập với Pi Network
                </button>
            </div>
        </main>
    </div>

    <nav class="pi-bottom-nav">
        <div class="pi-nav-item active"><i class="fas fa-home text-xl mb-1"></i><span>Học tập</span></div>
        <div class="pi-nav-item"><i class="fas fa-book-open text-xl mb-1"></i><span>Từ điển</span></div>
        <div class="pi-nav-main"><div class="pi-main-circle shadow-lg"><i class="fas fa-plus text-2xl"></i></div></div>
        <div class="pi-nav-item"><i class="fas fa-fire text-xl mb-1"></i><span>Thử thách</span></div>
        <div class="pi-nav-item"><i class="fas fa-user-circle text-xl mb-1"></i><span>Cá nhân</span></div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
