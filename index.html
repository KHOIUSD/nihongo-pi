<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nihongo Flashcards Pi</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.mine.pi/pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* KHÓA CỨNG GIAO DIỆN CHUẨN QUỐC TẾ */
        html, body {
            height: 100%; margin: 0; padding: 0;
            overflow: hidden; /* Chặn cuộn toàn trang để Header/Footer không trôi */
            background-color: #F8F6FF;
            font-family: sans-serif;
            overscroll-behavior: none;
        }

        #scroll-area {
            position: absolute;
            top: 56px; /* Chiều cao Header */
            bottom: 75px; /* Chiều cao Bottom Nav */
            left: 0; right: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px 16px;
        }

        /* CARD 3D SYSTEM - FIX LỖI MẤT MẶT TRƯỚC */
        #card-container { perspective: 1200px; width: 100%; aspect-ratio: 4/3; position: relative; margin-bottom: 2rem; }
        #card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d; cursor: pointer;
        }
        #card-inner.is-flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute; inset: 0;
            backface-visibility: hidden !important;
            -webkit-backface-visibility: hidden !important;
            border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .card-front { background: white; z-index: 2; transform: rotateY(0deg); }
        .card-back { background: #F5F3FF; z-index: 1; transform: rotateY(180deg); }

        /* NÚT LOA TÁCH BIỆT ĐỂ KHÔNG BỊ XOAY */
        .audio-hint-btn {
            position: absolute; top: 1.25rem; right: 1.25rem; z-index: 100;
            width: 3.5rem; height: 3.5rem; display: flex; align-items: center; justify-content: center;
            background: rgba(103, 58, 183, 0.1); border-radius: 50%; color: #673AB7;
        }

        /* PHONG CÁCH PI BOTTOM NAV (GIỮ NGUYÊN) */
        .pi-bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 75px;
            background: #fff; display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid #eee; z-index: 1000; padding-bottom: env(safe-area-inset-bottom);
        }
        .pi-nav-main { transform: translateY(-20px); }
        .pi-main-circle {
            width: 60px; height: 60px; background: linear-gradient(135deg, #673AB7, #4B0082);
            border-radius: 50%; border: 5px solid #D97706; color: #fff;
            display: flex; justify-content: center; align-items: center;
        }

        #side-menu.active { left: 0 !important; }
        #menu-overlay.active { display: block !important; opacity: 1 !important; }
    </style>
</head>
<body>
    <header class="fixed top-0 left-0 w-full h-14 bg-white flex items-center justify-between px-4 z-[1500] border-b shadow-sm">
        <button id="menu-toggle" class="text-[#D97706] text-xl p-2"><i class="fas fa-bars"></i></button>
        <h1 class="text-[#4B0082] font-bold text-lg">Nihongo Flashcard With Pi <span class="text-yellow-400">π</span></h1>
        <div class="w-8"></div> 
    </header>

    <div id="side-menu" class="fixed top-0 left-[-100%] w-[280px] h-full bg-white z-[2000] transition-all duration-300 shadow-2xl border-r-2 border-[#D97706] p-8">
        <button id="menu-close" class="absolute top-4 right-4 text-3xl text-[#D97706]">&times;</button>
        <nav class="flex flex-col gap-6 mt-10">
            <a href="#" class="text-[#D97706] font-bold flex items-center gap-4"><i class="fas fa-seedling text-yellow-600"></i> Level N4+N5</a>
            <a href="#" class="text-[#D97706] font-bold flex items-center gap-4"><i class="fas fa-cubes text-yellow-600"></i> Level N3</a>
        </nav>
    </div>
    <div id="menu-overlay" class="fixed inset-0 bg-black/50 z-[1999] hidden opacity-0 transition-opacity"></div>

    <div id="scroll-area">
        <main class="max-w-md mx-auto">
            <div id="user-info" class="bg-white rounded-xl p-3 shadow-sm mb-6 hidden border border-purple-50 flex justify-between items-center">
                <p class="text-xs font-medium">User: <span id="username" class="text-purple-600">...</span></p>
                <span id="premium-badge" class="hidden bg-yellow-100 text-yellow-700 text-[10px] font-bold px-2 py-1 rounded-full">PREMIUM 🌟</span>
            </div>

            <div class="mb-6">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-[10px] font-bold text-purple-500 uppercase">Tiến độ học tập</span>
                    <span id="progress-text" class="text-[10px] font-bold text-purple-500">0/10</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div id="progress-bar" class="bg-purple-600 h-2 rounded-full transition-all" style="width: 0%"></div>
                </div>
            </div>

            <div id="card-container">
                <button id="audio-hint" class="audio-hint-btn"><i class="fas fa-volume-up"></i></button>
                <div id="card-inner">
                    <div class="card-front">
                        <div class="absolute top-6 left-6 w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-[10px] font-bold text-gray-400 border" id="card-id-front">1</div>
                        <h2 id="word" class="text-6xl font-bold text-gray-800"></h2>
                    </div>
                    <div class="card-back p-6 text-center">
                        <div class="absolute top-6 left-6 w-10 h-10 rounded-full bg-white flex items-center justify-center text-[10px] font-bold text-purple-300 border" id="card-id-back">1</div>
                        <p id="reading" class="text-2xl text-purple-600 mb-2"></p>
                        <h3 id="meaning" class="text-3xl font-bold text-gray-800"></h3>
                        <p id="example" class="mt-6 text-sm text-gray-500 italic"></p>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-4 px-2">
                <button id="prev-btn" class="flex-1 h-14 rounded-full border-2 border-purple-600 text-purple-600 font-bold invisible">Quay lại</button>
                <button id="next-btn" class="flex-[2] h-14 rounded-full bg-purple-600 text-white font-bold shadow-lg">Tiếp theo</button>
                <button id="finish-btn" class="hidden flex-[2] h-14 rounded-full bg-green-500 text-white font-bold animate-bounce">Hoàn thành!</button>
            </div>

            <section id="premium-section" class="mt-8 bg-gradient-to-r from-yellow-50 to-orange-50 border border-yellow-200 rounded-2xl p-4 flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-yellow-800 text-sm">Gói Premium 🌟</h3>
                    <p class="text-[10px] text-yellow-700">Mở khóa 2000+ từ vựng</p>
                </div>
                <button onclick="unlockPremiumContent()" class="bg-yellow-500 text-white px-4 py-2 rounded-xl font-bold text-xs">3.14 Pi</button>
            </section>

            <button id="btn-auth" class="w-full mt-6 bg-white border-2 border-purple-600 text-purple-600 font-bold py-3 rounded-2xl">Kết nối ví Pi</button>
        </main>
    </div>

    <nav class="pi-bottom-nav">
        <div class="flex flex-col items-center text-amber-600"><i class="fa-solid fa-house"></i><span class="text-[10px]">Trang chủ</span></div>
        <div class="flex flex-col items-center text-amber-600"><i class="fa-solid fa-layer-group"></i><span class="text-[10px]">Từ vựng</span></div>
        <div class="pi-nav-main"><div class="pi-main-circle"><i class="fa-solid fa-plus"></i></div></div>
        <div class="flex flex-col items-center text-amber-600"><i class="fa-solid fa-graduation-cap"></i><span class="text-[10px]">Luyện đề</span></div>
        <div class="flex flex-col items-center text-amber-600"><i class="fa-solid fa-user"></i><span class="text-[10px]">Tôi</span></div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
